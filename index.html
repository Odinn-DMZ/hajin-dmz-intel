<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0e12">
<title>ODIN'S INTEL // HAJIN DMZ</title>
<meta name="description" content="Interactive Hajin DMZ intel map: banks, keys, compounds, caches, bosses, exfils.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="boot" class="boot" role="status" aria-live="polite">
  <div class="boot-fog" aria-hidden="true"></div>
  <div class="boot-embers" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <img class="boot-mark" src="assets/valknut.svg" alt="">
  <p class="boot-kicker mono">NORSE FIELD INTEL</p>
  <h1 class="boot-title"><span>ODIN'S INTEL</span></h1>
  <p class="boot-sub mono">HAJIN DMZ</p>
  <div class="boot-bar" aria-hidden="true"><span></span></div>
  <p class="boot-status mono" data-boot-status>ESTABLISHING UPLINK</p>
</div>
<header class="hud-top">
  <div class="hero-fx" aria-hidden="true">
    <div class="fog"></div>
    <div class="embers"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="hero-scan"></div>
  </div>
  <img src="assets/raven.svg" class="raven" alt="">
  <div class="brand">
    <div class="kicker mono">NORSE FIELD INTEL</div>
    <h1><span class="title-metal">ODIN'S INTEL</span> <span class="slash">//</span> <span class="title-metal">HAJIN DMZ</span></h1>
    <div class="sub mono">FIELD MAP · MW4 DMZ (2026) · <span id="updated"></span></div>
  </div>
  <img src="assets/valknut.svg" class="valknut" alt="">
  <button id="menuBtn" class="menu-btn" type="button" aria-label="Toggle layers" aria-expanded="false"><span class="menu-ico" aria-hidden="true">☰</span><span class="menu-label">LAYERS</span></button>
</header>
<nav class="tabs" role="tablist">
  <button class="tab active" data-tab="map" type="button">ᚱ Map</button>
  <button class="tab" data-tab="keys" type="button">ᚲ Keys</button>
  <button class="tab" data-tab="banks" type="button">ᚠ Banks</button>
  <button class="tab" data-tab="money" type="button">ᛟ Money</button>
  <button class="tab" data-tab="loot" type="button">ᚷ Keep / Sell</button>
  <button class="tab" data-tab="about" type="button">ᚨ Sources</button>
</nav>
<main>
  <section id="tab-map" class="panel active">
    <div id="scrim" class="scrim" hidden></div>
    <aside id="sidebar" class="sidebar">
      <input id="search" class="search" type="search" placeholder="Search: key, bank, POI, grid (e.g. G6)…" autocomplete="off">
      <ul id="results" class="results"></ul>
      <div class="imgctl">
        <label class="load-map">
          <span class="load-title">Load map image</span>
          <input type="file" id="imgFile" accept="image/*">
        </label>
        <label class="chk"><input type="checkbox" id="optImage"> Show map image</label>
        <label class="range">Opacity <input type="range" id="imgOpacity" min="0" max="1" step="0.05" value="0.7"></label>
      </div>
      <div class="rune-div">ᚠᚢᚦᚨᚱᚲ</div>
      <h3>Layers</h3>
      <div class="layer-btns"><button id="allOn" type="button">All</button><button id="allOff" type="button">None</button><button id="defaults" type="button">Default</button></div>
      <div id="layers" class="layers"></div>
      <div class="rune-div">ᚷᚹᚺᚾᛁᛃ</div>
      <h3>Map</h3>
      <label class="chk"><input type="checkbox" id="optGrid" checked> Grid</label>
      <label class="chk"><input type="checkbox" id="optOutline" checked> Outline</label>
      <label class="chk"><input type="checkbox" id="optLabels" checked> POI labels</label>
      <label class="chk"><input type="checkbox" id="optRoutes" checked> Money routes</label>
      <label class="chk"><input type="checkbox" id="optThreat" checked> Threat zones</label>
      <div class="legend" id="threatLegend"></div>
      <div class="legend" id="legend"></div>
    </aside>
    <div class="mapwrap">
      <svg id="map" xmlns="http://www.w3.org/2000/svg" aria-label="Hajin tactical grid"></svg>
      <div class="hud-corner mono" id="coords">X ---- Y ---- · --</div>
      <div class="zoom">
        <button id="zIn" type="button" aria-label="Zoom in">+</button>
        <button id="zOut" type="button" aria-label="Zoom out">−</button>
        <button id="zReset" type="button" aria-label="Reset view">⟲</button>
      </div>
      <article id="details" class="details hidden" aria-live="polite"></article>
    </div>
  </section>
  <section id="tab-keys" class="panel">
    <div class="tablebar">
      <input id="keySearch" class="search" type="search" placeholder="Filter keys…">
      <select id="keyRarity"><option value="">All rarities</option></select>
      <select id="keyWorth"><option value="">Any worth</option><option>Yes</option><option>Situational</option><option>No</option></select>
      <span class="mono tiny" id="keyCount"></span>
    </div>
    <div class="tablewrap"><table id="keyTable" class="grid-table"><thead><tr><th>Key</th><th>Rarity</th><th>Grid</th><th>Door / location</th><th>Inside</th><th>Worth it</th><th>Conf.</th><th></th></tr></thead><tbody></tbody></table></div>
  </section>
  <section id="tab-banks" class="panel scroll"><div id="banksView"></div></section>
  <section id="tab-money" class="panel scroll"><div id="moneyView"></div></section>
  <section id="tab-loot" class="panel scroll"><div id="lootView"></div></section>
  <section id="tab-about" class="panel scroll"><div id="aboutView"></div></section>
</main>
<script src="js/app.js"></script>
</body>
</html>
